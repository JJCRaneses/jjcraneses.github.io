<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* 1. BASE SETUP - Updated to Navy Theme */
        html {
            scroll-behavior: smooth;
            scroll-padding-top: 80px; 
        }
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            color: #e0e0e0;
            background-color: #232f43; /* Dark Navy Background */
            line-height: 1.5;
        }
        
        /* 2. NAVBAR - Updated for Navy */
        .navbar {
            position: sticky;
            top: 0;
            background-color: rgba(35, 47, 67, 0.85); /* Frosted Navy */
            backdrop-filter: blur(8px); 
            border-bottom: 1px solid #3a4b66; /* Lighter navy border */
            padding: 15px 40px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            z-index: 1000;
        }
        .nav-brand {
            font-family: 'Inter', sans-serif; 
            font-weight: 600;
            font-size: 1.1rem;
            color: #ffffff;
            letter-spacing: 0.5px;
        }
        .nav-links {
            display: flex;
            justify-content: center;
            gap: 25px;
        }
        .nav-links a {
            color: #a0a0a0;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .nav-links a:hover {
            color: #ffffff;
        }
        .nav-right {
            display: flex;
            justify-content: flex-end;
        }
        .nav-highlight-btn {
            background-color: #4ade80; 
            color: #121212;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        .nav-highlight-btn:hover {
            background-color: #22c55e;
        }

        /* 3. ABOUT SECTION (Two-Column Layout) */
        .section-about {
            background-color: transparent; /* Inherits the navy from body */
            padding: 120px 40px;
            display: flex;
            justify-content: center;
        }
        .about-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1100px;
            width: 100%;
            gap: 40px;
        }

        /* Left Column: Greeting & Typing Text */
        .about-text-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
        }

        /* Big Headline */
        .hero-headline {
            font-size: 3rem;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.3;
            margin: 0;
            letter-spacing: -0.5px;
        }

        /* Typewriter text styling */
        .typed-text {
            color: #4ade80; /* Green accent color */
            border-right: 3px solid #4ade80; /* Blinking cursor */
            white-space: nowrap;
            animation: blinkCursor 0.75s step-end infinite;
        }

        @keyframes blinkCursor {
            from, to { border-color: transparent }
            50% { border-color: #4ade80; }
        }

        /* Right Column: Floating Photo */
        .about-image-column {
            flex: 0 0 350px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes floatPhoto {
            0% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
            100% { transform: translateY(0); }
        }

        .profile-photo {
            width: 100%;
            max-width: 320px;
            height: auto;
            /* Since it's a transparent PNG with a lasso outline, we don't need border-radius on the img itself */
            animation: floatPhoto 4s ease-in-out infinite;
        }

        /* Responsive layout for smaller screens */
        @media (max-width: 850px) {
            .about-content {
                flex-direction: column-reverse; /* Puts image above text on mobile */
                text-align: center;
                align-items: center;
                gap: 20px;
            }
            .about-text-column {
                align-items: center;
                text-align: center;
            }
            .hero-headline {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">JJCR</div>
        <div class="nav-links">
            <a href="#about">About</a>
            <a href="#education">Education</a>
            <a href="#projects">Projects</a>
            <a href="#experience">Experience</a>
        </div> 
        <div class="nav-right">
            <a href="#" class="nav-highlight-btn" target="_blank">Connect</a> 
        </div> 
    </nav>

    <section id="about" class="section-about">
        <div class="about-content">
            <!-- Left Side: Text & Typewriter -->
            <div class="about-text-column">
                <h1 class="hero-headline">
                    Hey! Name's John, and<br>
                    I'm <span class="typed-text" id="typed-output"></span>
                </h1>
            </div>

            <!-- Right Side: Floating Magic Lasso Photo -->
            <div class="about-image-column">
                <!-- Using relative path for GitHub Pages compatibility -->
                <img src="Assets/John.png" alt="John Joshua Raneses" class="profile-photo">
            </div>
        </div>
    </section>

    <!-- Typewriter Cycling Script -->
    <script>
        // Array of words with grammatically correct articles
        const words = [
            "an accounting graduate", 
            "a computer nerd", 
            "a public speaker", 
            "a lifelong learner"
        ];
        
        let i = 0;
        let timer;

        function typingEffect() {
            let word = words[i].split("");
            var loopTyping = function() {
                if (word.length > 0) {
                    document.getElementById('typed-output').innerHTML += word.shift();
                } else {
                    setTimeout(deletingEffect, 2000); // Wait 2 seconds before backspacing
                    return;
                }
                timer = setTimeout(loopTyping, 100); // Typing speed
            };
            loopTyping();
        }

        function deletingEffect() {
            let word = document.getElementById('typed-output').innerHTML.split("");
            var loopDeleting = function() {
                if (word.length > 0) {
                    word.pop();
                    document.getElementById('typed-output').innerHTML = word.join("");
                } else {
                    i = (i + 1) % words.length;
                    setTimeout(typingEffect, 500); // Wait half a second before typing next word
                    return;
                }
                timer = setTimeout(loopDeleting, 40); // Deleting speed (faster than typing)
            };
            loopDeleting();
        }

        // Start the effect
        typingEffect();
    </script>

</body>
</html>
