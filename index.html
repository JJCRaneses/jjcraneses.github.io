<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* 1. BASE SETUP */
        html {
            scroll-behavior: smooth;
            scroll-padding-top: 80px; 
        }
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            color: #e0e0e0;
            background-color: #232f43; /* Dark Navy Background */
            line-height: 1.5;
        }
        
        /* 2. NAVBAR */
        .navbar {
            position: sticky;
            top: 0;
            background-color: #232f43; 
            border-bottom: 1px solid transparent; 
            padding: 20px 40px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            z-index: 1000;
            transition: background-color 0.3s, backdrop-filter 0.3s, padding 0.3s, border-bottom 0.3s;
        }

        .navbar.scrolled {
            background-color: rgba(43, 58, 85, 0.85); 
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #3a4b66;
            padding: 12px 40px; 
        }

        /* Stacked Brand Logo */
        .nav-brand {
            display: flex;
            flex-direction: column;
            line-height: 1; 
            text-transform: uppercase;
        }
        .nav-brand .first-name {
            font-weight: 800;
            font-size: 1.2rem;
            color: #ffffff;
            letter-spacing: 1px;
        }
        .nav-brand .last-name {
            font-weight: 600;
            font-size: 1.15rem;
            color: #4ade80; 
            letter-spacing: 2px;
        }

        /* Center Links */
        .nav-links {
            display: flex;
            justify-content: center;
            gap: 30px; 
        }
        .nav-links a {
            color: #a0a0a0;
            text-decoration: none;
            font-weight: 500;
            font-size: 1.05rem; 
            transition: color 0.2s;
        }
        .nav-links a:hover {
            color: #ffffff;
        }
        
        /* Right Side Social Buttons */
        .nav-right {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }
        .social-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.05); 
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .social-btn:hover {
            background-color: #4ade80;
            color: #121212;
            border-color: #4ade80;
            transform: translateY(-4px) scale(1.1); 
            box-shadow: 0 8px 15px rgba(74, 222, 128, 0.3); 
        }
        .social-btn svg {
            width: 18px;
            height: 18px;
        }

        /* 3. HOME SECTION */
        .section-home {
            background-color: transparent; 
            padding: 90px 40px 80px 40px; /* Perfect middle-ground padding */
            display: flex;
            justify-content: center;
        }
        .home-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1100px;
            width: 100%;
            gap: 40px;
        }

        .home-text-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
        }

        .hero-headline {
            font-size: 3rem;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.3;
            margin: 0;
            letter-spacing: -0.5px;
        }

        .typed-text {
            color: #4ade80; 
            border-right: 3px solid #4ade80; 
            white-space: nowrap;
            animation: blinkCursor 0.75s step-end infinite;
        }

        @keyframes blinkCursor {
            from, to { border-color: transparent }
            50% { border-color: #4ade80; }
        }

        /* Right Column: Floating Photo & Backdrop Circle */
        .home-image-column {
            flex: 0 0 380px;
            display: flex;
            justify-content: center;
            align-items: flex-end; 
        }

        /* The container holding both the circle and the image */
        .image-wrapper {
            position: relative;
            width: 100%;
            height: 380px; 
            display: flex;
            justify-content: center;
            align-items: flex-end; 
        }

        /* The static background circle */
        .circle-backdrop {
            position: absolute;
            width: 320px;
            height: 320px;
            background-color: #2f405d; 
            border-radius: 50%;
            z-index: 0;
            box-shadow: 0 0 40px rgba(47, 64, 93, 0.4); 
            bottom: 0; 
            left: 50%;
            transform: translateX(-50%);
        }

        /* The floating photo */
        .profile-photo {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 320px;
            height: auto;
            animation: floatPhoto 4s ease-in-out infinite;
            transform-origin: bottom; 
        }

        @keyframes floatPhoto {
            0% { transform: translateY(0); }
            50% { transform: translateY(-15px); } 
            100% { transform: translateY(0); }
        }

        @media (max-width: 850px) {
            .home-content {
                flex-direction: column-reverse; 
                text-align: center;
                align-items: center;
                gap: 40px;
            }
            .home-text-column {
                align-items: center;
                text-align: center;
            }
            .hero-headline {
                font-size: 2.2rem;
            }
            .nav-right {
                gap: 8px;
            }
            .social-btn {
                width: 36px;
                height: 36px;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">
            <span class="first-name">John</span>
            <span class="last-name">Raneses</span>
        </div>
        
        <div class="nav-links">
            <a href="#home">Home</a>
            <a href="#education">Education</a>
            <a href="#showcase">Showcase</a>
        </div> 
        
        <div class="nav-right">
            <a href="https://linkedin.com/in/YOUR_LINKEDIN" target="_blank" class="social-btn" aria-label="LinkedIn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
                    <rect x="2" y="9" width="4" height="12"></rect>
                    <circle cx="4" cy="4" r="2"></circle>
                </svg>
            </a>
            
            <a href="mailto:your.email@gmail.com" class="social-btn" aria-label="Email">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
            </a>
            
            <a href="tel:+971500000000" class="social-btn" aria-label="Phone">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                </svg>
            </a>
        </div> 
    </nav>

    <section id="home" class="section-home">
        <div class="home-content">
            <!-- Left Side -->
            <div class="home-text-column">
                <h1 class="hero-headline">
                    Hey! Name's John, and<br>
                    I'm <span class="typed-text" id="typed-output"></span>
                </h1>
            </div>

            <!-- Right Side: Layered Depth Effect -->
            <div class="home-image-column">
                <div class="image-wrapper">
                    <div class="circle-backdrop"></div>
                    <img src="Assets/John.png" alt="John Joshua Raneses" class="profile-photo">
                </div>
            </div>
        </div>
    </section>

    <script>
        // Navbar Scroll Effect
        window.addEventListener('scroll', function() {
            const navbar = document.querySelector('.navbar');
            if (window.scrollY > 50) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });

        // Typewriter Effect
        const words = [
            "an accounting graduate", 
            "a computer enthusiast", 
            "a public speaker", 
            "a passionate tutor"
        ];
        
        let i = 0;
        let timer;

        function typingEffect() {
            let word = words[i].split("");
            var loopTyping = function() {
                if (word.length > 0) {
                    document.getElementById('typed-output').innerHTML += word.shift();
                } else {
                    setTimeout(deletingEffect, 2000); 
                    return;
                }
                timer = setTimeout(loopTyping, 100); 
            };
            loopTyping();
        }

        function deletingEffect() {
            let word = document.getElementById('typed-output').innerHTML.split("");
            var loopDeleting = function() {
                if (word.length > 0) {
                    word.pop();
                    document.getElementById('typed-output').innerHTML = word.join("");
                } else {
                    i = (i + 1) % words.length;
                    setTimeout(typingEffect, 500); 
                    return;
                }
                timer = setTimeout(loopDeleting, 40); 
            };
            loopDeleting();
        }

        typingEffect();
    </script>

</body>
</html>
